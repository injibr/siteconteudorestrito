<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Liberado</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #0a3d1f; }
    .feedback-icon {
      font-size: 5rem;
      border: 4px solid #fff;
      padding: 1.5rem 2rem;
      display: inline-block;
      margin-bottom: 2rem;
      background: #000;
    }
    .feedback-title {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      color: #4ade80;
    }
    .feedback-body {
      font-size: 1.1rem;
      color: #bbf7d0;
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="feedback-icon">✓</div>
    <p class="feedback-title">Idade verificada</p>
    <p class="feedback-body">Você tem 18 anos ou mais.</p>
    <img src="../hairy_leg.jpg" alt="Uma perna feminina cabeluda" class="content-image">
    <br><br>
    <a href="../" class="btn btn--outline">← Voltar</a>
  </div>
</body>
</html>
